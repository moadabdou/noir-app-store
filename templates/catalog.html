<section class="shell catalog">
  <header class="catalog__head">
    <p class="eyebrow"><span class="eyebrow__dot"></span>{{eyebrow}}</p>
    <h1 class="catalog__title">{{heading}}</h1>
    <p class="catalog__blurb">{{blurb}}</p>
  </header>

  <div class="tabs" role="navigation" aria-label="Catalogue type">{{tabs}}</div>

  <form class="catalog__toolbar" action="/search" method="get" role="search" id="catalog-form" data-type="{{kind}}" data-category="{{active_category}}">
    <div class="search search--block">
      <svg class="search__icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input class="search__input" type="search" id="catalog-search" name="q" value="{{query}}" placeholder="{{search_hint}}" autocomplete="off">
      <input type="hidden" name="type" value="{{kind}}">
    </div>
    <div class="catalog__controls">
      <label class="select">
        <span class="select__label">Sort</span>
        <select name="sort" id="catalog-sort">
          <option value="popular">Most popular</option>
          <option value="newest">Recently updated</option>
          <option value="rating">Top rated</option>
          <option value="size">Largest size</option>
          <option value="name">A – Z</option>
        </select>
      </label>
      <button class="btn btn--primary btn--sm" type="submit">Apply</button>
    </div>
  </form>

  <div class="chips chips--filter" id="filter-chips">{{chips}}<a class="chip chip--mods{{mods_class}}" href="/apps?mods=1" data-mods-filter>Mods<span class="chip__count">{{mod_count}}</span></a></div>

  <div class="catalog__meta">
    <p class="catalog__count" id="result-count"><b>{{result_count}}</b> {{heading}} listed</p>
    <p class="catalog__hint" id="filter-hint" hidden></p>
  </div>

  <div class="grid grid--cards" id="catalog-grid">{{cards}}</div>

  <nav class="pager" id="catalog-pager" aria-label="Catalogue pages">{{pager}}</nav>

  <div class="empty" id="empty-state" hidden>
    <span class="empty__mark" aria-hidden="true">∅</span>
    <h2 class="empty__title">Nothing matches that</h2>
    <p class="empty__text">Try a shorter search, another category, or clear the filters and browse the full catalogue.</p>
    <a class="btn btn--primary btn--sm" href="/apps">Reset filters</a>
  </div>
</section>

<script type="application/json" id="catalog-data">{{catalog_json}}</script>
