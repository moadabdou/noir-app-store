<section class="shell catalog">
  <header class="catalog__head">
    <p class="eyebrow"><span class="eyebrow__dot"></span>{{category_count}} categories</p>
    <h1 class="catalog__title">Browse every category</h1>
    <p class="catalog__blurb">Each shelf holds apps and games we have actually read, ranked by what people are installing this week.</p>
  </header>

  <div class="cat-grid">{{categories}}</div>
</section>
