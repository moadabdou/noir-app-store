<section class="shell notfound">
  <div class="notfound__code" aria-hidden="true">
    <span>4</span><span>0</span><span>4</span>
  </div>
  <h1 class="notfound__title">This page is not in the catalogue.</h1>
  <p class="notfound__text">We could not find <code>{{missing_path}}</code>. It may have been renamed, or the link might be from an older edition of the store.</p>

  <form class="notfound__search" action="/search" method="get" role="search">
    <div class="search search--block">
      <svg class="search__icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input class="search__input" type="search" name="q" placeholder="Search the catalogue" aria-label="Search the catalogue" autocomplete="off">
      <input type="hidden" name="type" value="all">
    </div>
    <button class="btn btn--primary" type="submit">Search</button>
  </form>

  <div class="notfound__links">
    <a class="btn btn--ghost btn--sm" href="/">Back home</a>
    <a class="btn btn--ghost btn--sm" href="/apps">All apps</a>
    <a class="btn btn--ghost btn--sm" href="/games">All games</a>
    <a class="btn btn--ghost btn--sm" href="/categories">Categories</a>
  </div>

  <section class="section">
    <div class="section__head">
      <h2 class="section__title">Popular right now</h2>
      <a class="section__link" href="/apps">See all</a>
    </div>
    <div class="grid grid--cards">{{popular}}</div>
  </section>
</section>

<script type="application/json" id="catalog-data">{{catalog_json}}</script>
